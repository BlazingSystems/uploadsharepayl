name: NRSuite ESP8266 Compile

on:
  push:
    paths:
      - 'NRSuite-Dual/ESP8266/**'
      - '.github/workflows/nrsuite-esp8266.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP8266 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
      - name: Compile NodeMCU target
        run: |
          mkdir -p build/NRSuite_ESP8266_Dual
          cp NRSuite-Dual/ESP8266/NRSuite_ESP8266_Dual.ino build/NRSuite_ESP8266_Dual/NRSuite_ESP8266_Dual.ino
          arduino-cli compile --warnings all --fqbn esp8266:esp8266:nodemcuv2 build/NRSuite_ESP8266_Dual
